name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets the weekly release workflow run the same checks before deploying.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called from weekly-release,
  # so a push to the same branch never cancels a release run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, unit, e2e, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatter-backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chatter-backend/pnpm-lock.yaml
      # Same install command as the Dockerfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm test:e2e
        env:
          E2E_MONGODB_URL: mongodb://localhost:27017
      - run: pnpm run build

  frontend:
    name: Frontend (type check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatter-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chatter-ui/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test --watchAll=false
        env:
          CI: true
      - run: pnpm run build
        env:
          CI: false # CRA treats lint warnings as errors when CI=true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - run: docker compose build
